# Bubble App inteiro numa máquina só: banco, site, API e proxy.
#
# 🔴 **O Postgres roda aqui dentro, não num serviço gerenciado.** Antes era Neon, e o
# zero-cache mantinha um slot de replicação lógica permanente que impedia o autosuspend:
# 24 h/dia de compute com quase ninguém usando, e a cota do free tier morria por volta do
# dia 8 de todo mês. Sem o Zero o slot não existe mais, e com o banco na própria máquina
# não há cota nenhuma para estourar — a leitura também para de cruzar a rede.
#
# Fora daqui fica só o Cloudflare R2 (mídia), que tem free tier de verdade.
#
# ⚠️ **O disco agora é o produto.** Um `docker compose down -v` distraído apaga o banco.
# Ver a seção de backup no README.
#
# Passos completos: README.md nesta pasta.

services:
  # Único container exposto à internet. Emite e renova o certificado sozinho.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # `[::]` explícito: numa máquina IPv6-only a forma curta (`'80:80'`) publica em
    # 0.0.0.0, que ali não recebe nada. Em dual-stack este socket atende os dois.
    ports:
      - '[::]:80:80'
      - '[::]:443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados; perder isto refaz a emissão
      - caddy_config:/config
    depends_on:
      - app

  # O Postgres.
  #
  # 🔴 **`wal_level=replica`, explicitamente NÃO `logical`.** Replicação lógica é o que
  # cria slot, e slot é o que prendia o WAL e mantinha o compute do Neon acordado. Sem
  # sync engine, nada aqui precisa dela.
  #
  # Sem `ports:` de propósito — o banco não vai para a internet. Para acessar da sua
  # máquina: `ssh -L 5433:localhost:5432` e `docker compose exec db psql -U bubble`.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # o default de 64m estoura em query paralela
    shm_size: 128mb
    environment:
      POSTGRES_USER: bubble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bubble
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bubble -d bubble']
      interval: 10s
      timeout: 5s
      retries: 10
    # Tuning para uma máquina de 1 GB. `shared_buffers` em ~10% da RAM: o conjunto de
    # dados de um criador só cabe inteiro em cache, e é daí que vem a leitura rápida.
    # `effective_cache_size` é estimativa para o planner, não alocação.
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_level=replica
      -c max_wal_size=512MB
      -c min_wal_size=80MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c log_min_duration_statement=200
      -c statement_timeout=15000
      -c idle_in_transaction_session_timeout=60000

  # Roda as migrations e sai. Mesma imagem do app.
  migrate:
    image: SEU_USUARIO/bubble-app:latest
    restart: 'no'
    env_file: app.env
    environment:
      RUN: '1'
    depends_on:
      db:
        condition: service_healthy
    command: ['node', '/app/src/database/migrate-dist.js']

  # O site e todas as rotas `app/api/*` (auth, mídia, billing, cron, conteúdo).
  #
  # ⚠️ A imagem é construída na SUA máquina e publicada num registry — o `Dockerfile`
  # roda `bun install`, que não cabe na RAM daqui. Ver o README.
  #
  # Docker Hub e não ghcr.io: o ghcr.io não publica AAAA, então numa máquina IPv6-only
  # o pull morre com `i/o timeout` num endereço IPv4 e não há o que configurar.
  app:
    image: SEU_USUARIO/bubble-app:latest
    restart: unless-stopped
    env_file: app.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8092'

volumes:
  pgdata: # 🔴 o produto mora aqui
  caddy_data:
  caddy_config:

# 🔴 Numa máquina IPv6-only isto é obrigatório, e o `daemon.json` sozinho NÃO cobre:
# `"ipv6": true` lá vale para a bridge padrão (`docker0`), enquanto o Compose cria uma
# rede própria — que nasce IPv4-only e deixa o container sem rota.
#
# Em dual-stack não atrapalha: fica sobrando.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:bbb2::/64
