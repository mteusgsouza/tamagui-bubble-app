# Bubble App inteiro numa máquina só: site, API e sync.
#
# Foi para cá porque o Fly em trial dura 7 dias e não deixa cadastrar domínio próprio —
# e sem domínio não há login com Google. Fora daqui ficam só o Neon (Postgres) e o
# Cloudflare R2 (mídia), que têm free tier de verdade.
#
# Passos completos: README.md nesta pasta.

services:
  # Único container exposto à internet. Emite e renova o certificado sozinho.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # `[::]` explícito: numa máquina IPv6-only a forma curta (`'80:80'`) publica em
    # 0.0.0.0, que ali não recebe nada. Em dual-stack este socket atende os dois.
    ports:
      - '[::]:80:80'
      - '[::]:443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados; perder isto refaz a emissão
      - caddy_config:/config
    depends_on:
      - app
      - zero

  # O site e todas as rotas `app/api/*` (auth, mídia, billing, cron, zero).
  #
  # ⚠️ A imagem é construída na SUA máquina e publicada num registry — o `Dockerfile`
  # roda `bun install`, que não cabe na RAM daqui. Ver o README.
  app:
    image: ghcr.io/SEU_USUARIO/bubble-app:latest
    restart: unless-stopped
    env_file: app.env
    expose:
      - '8092'

  zero:
    # A versão TEM que casar com `@rocicorp/zero` do package.json e com `ZERO_VERSION`
    # do app: cliente e servidor precisam falar o mesmo protocolo.
    image: rocicorp/zero:0.26.2
    restart: unless-stopped
    env_file: zero.env
    volumes:
      - zero_data:/data
    environment:
      ZERO_LOG_LEVEL: ${ZERO_LOG_LEVEL:-info}

      # o replica vive no volume; sem isso ele é reconstruído do Postgres a cada restart
      ZERO_REPLICA_FILE: /data/replica.db

      # tem que bater com a publicação que `src/database/migrate.ts` cria
      ZERO_APP_PUBLICATIONS: ${ZERO_APP_PUBLICATIONS:-zero_takeout}

      # Endereço INTERNO do app server — é ele quem decide o que cada usuário pode ver.
      # Interno de propósito: não sai para a internet, não depende de DNS nem de TLS, e
      # não paga a volta pelo Caddy.
      ZERO_MUTATE_URL: http://app:8092/api/zero/push
      ZERO_QUERY_URL: http://app:8092/api/zero/pull

      # a sessão do usuário viaja por cookie até o app server, que é quem decide
      ZERO_MUTATE_FORWARD_COOKIES: 'true'
      ZERO_QUERY_FORWARD_COOKIES: 'true'

      # limite de mutations por usuário. O throttle do progresso de aula
      # (`useLessonProgress`) foi dimensionado contra este número.
      ZERO_PER_USER_MUTATION_LIMIT_MAX: '30'
      ZERO_PER_USER_MUTATION_LIMIT_WINDOW_MS: '60000'

      # conexões no Neon: some ao que o app server usa antes de aumentar
      ZERO_UPSTREAM_MAX_CONNS: '10'
      ZERO_CVR_MAX_CONNS: '4'
      ZERO_NUM_SYNC_WORKERS: '2'

    expose:
      - '4848'

volumes:
  zero_data:
  caddy_data:
  caddy_config:

# 🔴 Numa máquina IPv6-only isto é obrigatório, e o `daemon.json` sozinho NÃO cobre:
# `"ipv6": true` lá vale para a bridge padrão (`docker0`), enquanto o Compose cria uma
# rede própria — que nasce IPv4-only e deixa o container sem rota.
#
# O sintoma é o zero-cache morrendo no boot com `ENETUNREACH` no endereço IPv6 do Neon
# (e `ETIMEDOUT` nos IPv4, que ali não existem mesmo).
#
# Em dual-stack não atrapalha: fica sobrando.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:bbb2::/64
