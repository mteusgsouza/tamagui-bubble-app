services:
  pgdb:
    image: pgvector/pgvector:pg16
    shm_size: 1g
    restart: always
    healthcheck:
      test: 'pg_isready -U user --dbname=postgres'
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - 5533:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    # 🔴 Este bloco vira **lista de argumentos**, não linha de shell: o compose separa
    # por espaço. Comentário aqui dentro não é comentário — o `#` chega ao Postgres como
    # argumento, ele não sobe, o healthcheck nunca passa e o `migrate` espera para
    # sempre. O sintoma é "migrations timed out", que não aponta para cá.
    # `log_min_duration_statement=200`: qualquer query acima disso aparece no log.
    command: |
      postgres
      -c max_connections=256
      -c log_error_verbosity=terse
      -c log_min_messages=fatal
      -c idle_in_transaction_session_timeout=300000
      -c log_min_duration_statement=200
      -c statement_timeout=60000
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=3
    # for verbose logging when debugging (uncomment as needed):
      # -c log_error_verbosity=default
      # -c log_min_messages=info
      # -c log_statement=all
      # -c log_connections=on
      # -c log_disconnections=on
      # -c log_duration=on
      # -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    volumes:
      - pgdb_data:/var/lib/postgresql/data
      - ./src/database/:/docker-entrypoint-initdb.d

  migrate:
    image: node:24-slim
    depends_on:
      pgdb:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app/src/database
    environment:
      - RUN=1
      - ALLOW_MISSING_ENV=1
      - DATABASE_URL=postgresql://user:password@pgdb:5432/postgres
    command: node migrate-dist.js

volumes:
  pgdb_data:
