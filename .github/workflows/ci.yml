name: CI

# 🔴 O filtro de "só documentação" é `paths-ignore`, não um `if:` na mensagem do commit.
#
# Era `if: !contains(github.event.commits[0].message, 'docs:')`, e `commits[0]` é o
# commit **mais antigo do push**, não o último: um lote de 14 commits pulava o CI
# inteiro porque o primeiro deles por acaso era de documentação. Foi assim que um
# `fix(ci)` foi para a main sem nunca ser exercitado.
#
# `paths-ignore` responde a pergunta certa — "este push mexeu em alguma coisa além de
# documentação?" — e não depende de convenção de mensagem.
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Check
        run: bun check:all

  integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Integration Tests
        run: bun scripts/integration.ts
        env:
          # 🔒 start - this is generated by "bun env:update"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          VITE_WEB_HOSTNAME: ${{ secrets.VITE_WEB_HOSTNAME }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          BILLING_PROVIDER: ${{ secrets.BILLING_PROVIDER }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXTRA_TRUSTED_ORIGINS: ${{ secrets.EXTRA_TRUSTED_ORIGINS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # 🔒 end - this is generated by "bun env:update"
